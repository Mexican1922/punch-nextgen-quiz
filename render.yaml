# Render Blueprint: the Django API and its PostgreSQL database.
# Render → New → Blueprint → pick this repo. Then set CORS_ALLOWED_ORIGINS
# to the Vercel URL of the frontend.
services:
  - type: web
    name: nextgen-quiz-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed --demo-students
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nextgen-quiz-db
          property: connectionString

databases:
  - name: nextgen-quiz-db
    plan: free
